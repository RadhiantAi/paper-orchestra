name: Offline validation
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  PAPER_NETWORK_MODE: offline
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: ruff check --select F821,F822,F823,E9 .
      - run: git diff --check
  tex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: docker build -f docker/tex.Dockerfile -t paper-orchestra-tex:local .
      - run: python -m pytest tests/test_reliability.py -q -k real_isolated_tex
        env:
          RUN_TEX_INTEGRATION: '1'
  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: python -m pytest tests/test_ocr_integration.py -q
        env:
          RUN_OCR_INTEGRATION: '1'
